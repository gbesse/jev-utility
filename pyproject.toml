# Purpose: Provider-neutral probability decision toolkit metadata.
[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="jev-utility"
version="0.1.0"
description="Expected-utility thresholds, abstention, calibration and value-of-information analysis."
requires-python=">=3.11"
license={text="MIT"}
authors=[{name="Guillaume Besse"}]
dependencies=[]
[project.scripts]
jev-utility="jev_utility.cli:main"
[tool.setuptools.packages.find]
where=["src"]
